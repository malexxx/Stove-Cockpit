name: Android — Build APK & Play Store AAB

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  android-build:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install & Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
          npx cap sync android
      - name: Decode Release Keystore (if configured)
        id: keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > /tmp/release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "has_play_json=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_play_json=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Compute Version Code
        id: ver
        run: |
          echo "code=$((${GITHUB_RUN_NUMBER:-1}))" >> "$GITHUB_OUTPUT"
      - name: Build Signed Release AAB & APK
        if: steps.keystore.outputs.signed == 'true'
        working-directory: frontend/android
        env:
          ANDROID_VERSION_CODE: ${{ steps.ver.outputs.code }}
          ANDROID_KEYSTORE_PATH: /tmp/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease
      - name: Build Debug APK (Fallback without keystore)
        if: steps.keystore.outputs.signed != 'true'
        working-directory: frontend/android
        env:
          ANDROID_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          APK_RELEASE=(frontend/android/app/build/outputs/apk/release/*.apk)
          APK_DEBUG=(frontend/android/app/build/outputs/apk/debug/*.apk)
          AAB_RELEASE=(frontend/android/app/build/outputs/bundle/release/*.aab)
          if [ ${#APK_RELEASE[@]} -gt 0 ]; then
            cp "${APK_RELEASE[0]}" "release-assets/StoveCockpit-${GITHUB_REF_NAME}.apk"
          elif [ ${#APK_DEBUG[@]} -gt 0 ]; then
            cp "${APK_DEBUG[0]}" "release-assets/StoveCockpit-${GITHUB_REF_NAME}-debug.apk"
          fi
          if [ ${#AAB_RELEASE[@]} -gt 0 ]; then
            cp "${AAB_RELEASE[0]}" "release-assets/StoveCockpit-${GITHUB_REF_NAME}.aab"
          fi
          ls -lh release-assets/
      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: stove-cockpit-android
          path: release-assets/*
          if-no-files-found: warn
      - name: Attach APK/AAB to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.apk
            release-assets/*.aab
          fail_on_unmatched_files: false
      - name: Publish to Google Play Internal Track (if configured)
        if: startsWith(github.ref, 'refs/tags/v') && steps.keystore.outputs.signed == 'true' && steps.keystore.outputs.has_play_json == 'true'
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.malexxx.stovecockpit
          releaseFiles: frontend/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
      - name: Cleanup Keystore
        if: always()
        run: rm -f /tmp/release.keystore
