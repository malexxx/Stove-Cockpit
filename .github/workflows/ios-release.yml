name: iOS — Build Unsigned IPA (Sideloading)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  ios-unsigned:
    name: Build Unsigned .ipa on macOS
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, Build & Sync iOS
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
          npx cap sync ios
      - name: Install CocoaPods Dependencies
        working-directory: frontend/ios/App
        run: pod install --repo-update || pod install
      - name: Build Unsigned Release App Bundle
        working-directory: frontend/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build
      - name: Package Unsigned .ipa
        working-directory: frontend/ios/App
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/App.app
          zip -qry StoveCockpit-unsigned.ipa Payload
      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StoveCockpit-unsigned-ipa
          path: frontend/ios/App/StoveCockpit-unsigned.ipa
      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/ios/App/StoveCockpit-unsigned.ipa
          fail_on_unmatched_files: false
