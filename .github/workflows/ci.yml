name: CI — Backend & Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Python & Matter Bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest schemathesis ruff
      - name: Lint Python code (Ruff)
        run: ruff check backend
      - name: Build frontend bundle for SPA tests
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Check Matter bridge JS syntax
        run: node --check backend/matter_bridge/bridge.mjs
      - name: Run backend test suite
        working-directory: backend
        env:
          DB_PATH: /tmp/stove_ci_test.db
        run: |
          pytest -q --ignore=tests/test_ui_playwright.py tests

  frontend-tests:
    name: Frontend Vitest & Vite Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test
      - name: Build production bundle
        working-directory: frontend
        run: npm run build
      - name: Verify bundle outputs
        run: |
          test -f frontend/dist/index.html
          test -f frontend/dist/css/tailwind.generated.css
