<!-- =================================================================== -->
<!-- ONGLET 1 (AFFICHÉ PAR DÉFAUT) : PILOTAGE TRI-ARC V10 (SANS CADRE)   -->
<!-- =================================================================== -->
<section id="tab-control" class="space-y-1 sm:space-y-2 overflow-hidden overscroll-none touch-pan-x">
  <div id="triarc-cockpit-card" class="w-full max-w-[460px] mx-auto overflow-hidden relative select-none">

    <!-- Indicateurs des 3 écrans (SX | Poêle | DX) -->
    <div class="pt-1 pb-0.5 flex items-center justify-center gap-2">
      <button type="button" onclick="goToTriArcZone('SX')" id="triarc-dot-sx"
        class="w-2 h-2 rounded-full bg-slate-700 transition-all" title="Canalisation Gauche (SX)"></button>
      <button type="button" onclick="goToTriArcZone('AMB')" id="triarc-dot-amb"
        class="w-4 h-2 rounded-full bg-amber-400 transition-all" title="Poêle / Salon (AMB)"></button>
      <button type="button" onclick="goToTriArcZone('DX')" id="triarc-dot-dx"
        class="w-2 h-2 rounded-full bg-slate-700 transition-all" title="Canalisation Droite (DX)"></button>
    </div>

    <!-- Carrousel Horizontal Tactile (Swipe Gauche / Droite : SX ⇄ Poêle ⇄ DX) -->
    <div id="triarc-carousel-viewport" class="triarc-carousel-viewport overflow-hidden w-full relative select-none">
      <div id="triarc-carousel-track"
        class="triarc-carousel-track flex flex-row flex-nowrap w-full transition-transform duration-300 ease-out will-change-transform"
        style="transform: translateX(-100%);">
        <!-- Slide 0 : Soufflerie Gauche (SX) -->
        <div id="triarc-slide-SX"
          class="triarc-carousel-slide w-full min-w-full flex-shrink-0 px-1 py-1 sm:p-3 flex flex-col justify-between gap-2 relative box-border">
        </div>
        <!-- Slide 1 : Écran Principal Poêle (AMB) -->
        <div id="triarc-slide-AMB"
          class="triarc-carousel-slide w-full min-w-full flex-shrink-0 px-1 py-1 sm:p-3 flex flex-col justify-between gap-2 relative box-border">
        </div>
        <!-- Slide 2 : Soufflerie Droite (DX) -->
        <div id="triarc-slide-DX"
          class="triarc-carousel-slide w-full min-w-full flex-shrink-0 px-1 py-1 sm:p-3 flex flex-col justify-between gap-2 relative box-border">
        </div>
      </div>
    </div>
  </div>

  <!-- Conteneur unifié des 10 interfaces alternatives de pilotage -->
  <div id="cockpit-alt-root" class="hidden w-full max-w-[480px] mx-auto relative select-none pb-2"></div>

  <!-- Calque de bulle flottante par-dessus l'écran pour les options (Silence / Auto / Boost / Éco) -->
  <div id="triarc-floating-overlay"
    class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 overflow-y-auto"
    onclick="if(event.target===this){closeTriArcOptionBubble();}">
    <div id="triarc-floating-bubble" class="w-full max-w-sm m-auto max-h-[90vh] overflow-y-auto"></div>
  </div>

  <!-- Registres & IDs de télémétrie conservés masqués pour la rétrocompatibilité JS -->
  <div class="hidden" aria-hidden="true">
    <span id="kpi-auto">--</span>
    <span id="kpi-clim">--</span>
    <span id="kpi-sil">--</span>
    <span id="kpi-pwf">--</span>
    <span id="ctl-pwf-status-label"></span>
    <span id="kpi-amb-delta">--</span>
    <span id="kpi-amb">--</span>
    <strong id="ctl-amb-val">19 °C</strong>
    <span id="kpi-amb-sp">19 °C</span>
    <span id="ctl-amb-meas">--</span>
    <span id="ctl-real-fan">--</span>
    <span id="kpi-fan">--</span>
    <input id="ctl-amb-slider" type="range" min="7" max="41" step="1" />
    <span id="kpi-dl-t">--</span>
    <strong id="kpi-dl-sp">--</strong>
    <span id="ctl-dl-sp">--</span>
    <span id="ctl-dl-meas">--</span>
    <span id="kpi-dl-v">--</span>
    <span id="kpi-dl-act">--</span>
    <input id="ctl-dl-slider" type="range" min="7" max="41" step="1" />
    <span id="kpi-dr-t">--</span>
    <strong id="kpi-dr-sp">--</strong>
    <span id="ctl-dr-sp">--</span>
    <span id="ctl-dr-meas">--</span>
    <span id="kpi-dr-v">--</span>
    <span id="kpi-dr-act">--</span>
    <input id="ctl-dr-slider" type="range" min="7" max="41" step="1" />
    <span id="ctl-power-mode-desc"></span>
    <span id="ctl-real-pwr">--</span>
    <span id="kpi-pwr">--</span>
  </div>
</section>
